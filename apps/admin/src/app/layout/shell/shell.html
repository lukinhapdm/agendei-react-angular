<mat-sidenav-container class="container">
  <mat-sidenav #sidenav [mode]="sidenavMode()" [opened]="!isMobile()" class="sidenav">
    <div class="brand">Agendei</div>
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          (click)="isMobile() && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isMobile()) {
        <button mat-icon-button aria-label="Abrir menu" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span>Painel do negócio</span>
      <span class="spacer"></span>
      <span class="email">{{ userEmail() }}</span>
      <button mat-icon-button aria-label="Sair" (click)="signOut()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
