<header class="header">
  <h1>Serviços</h1>
  <button mat-flat-button (click)="openForm()">
    <mat-icon>add</mat-icon>
    Novo serviço
  </button>
</header>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="table-wrapper">
  <table mat-table [dataSource]="services()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let s" [class.inactive]="!s.active">{{ s.name }}</td>
    </ng-container>

    <ng-container matColumnDef="duration">
      <th mat-header-cell *matHeaderCellDef>Duração</th>
      <td mat-cell *matCellDef="let s">{{ s.duration_min }} min</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Preço</th>
      <td mat-cell *matCellDef="let s">{{ s.price_cents / 100 | currency: 'BRL' }}</td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Visível</th>
      <td mat-cell *matCellDef="let s">
        <mat-slide-toggle
          [checked]="s.active"
          (change)="toggleActive(s)"
          [aria-label]="'Visibilidade de ' + s.name"
        />
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let s" class="actions">
        <button mat-icon-button (click)="openForm(s)" [attr.aria-label]="'Editar ' + s.name">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="remove(s)" [attr.aria-label]="'Excluir ' + s.name">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell empty" [attr.colspan]="columns.length">
        Nenhum serviço ainda. Clique em "Novo serviço" para começar.
      </td>
    </tr>
  </table>
</div>
